      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Fons arrodonit -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Òrbites externes solapades (enllaç covalent) -->
