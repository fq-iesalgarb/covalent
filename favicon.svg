  <circle cx="40" cy="32" r="16" fill="none" stroke="#2dd4bf" stroke-width="2.4" opacity="0.9" />

  <!-- Nuclis dels dos àtoms no-metàl·lics -->
  <circle cx="20" cy="32" r="4.8" fill="#38bdf8" />
  <circle cx="44" cy="32" r="4.8" fill="#2dd4bf" />

  <!-- Parell d'electrons compartits a la zona central de solapament -->
  <circle cx="32" cy="27.5" r="3.1" fill="#fbbf24" stroke="#0f172a" stroke-width="0.8" />
